<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <!-- Rich 24k Gold Gradient -->
    <linearGradient id="luxuryGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d790"/>
      <stop offset="30%" stop-color="#dfb56c"/>
      <stop offset="70%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#9a7114"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Large Center Serif 'J' -->
  <!-- Top bar of J -->
  <rect x="180" y="24" width="40" height="7" rx="1.5" fill="url(#luxuryGold)" />
  <!-- Stem of J -->
  <path d="M 197 31 L 203 31 L 203 145 C 203 185, 185 208, 150 208 C 122 208, 110 192, 108 178 C 107 172, 113 167, 119 168 C 124 169, 126 173, 128 178 C 132 188, 140 196, 152 196 C 172 196, 186 178, 186 145 L 186 31 Z" fill="url(#luxuryGold)" />

  <!-- Horizontal 'SALON' in Bold Caps across the middle -->
  <text x="200" y="125" 
        font-family="'Playfair Display', 'Cinzel', 'Montserrat', 'Inter', sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="14" 
        fill="#ffffff" 
        text-anchor="middle"
        style="text-transform: uppercase;">SALON</text>

  <!-- 'UNISEX' aligned to the right underneath SALON -->
  <text x="228" y="156" 
        font-family="'Montserrat', 'Outfit', sans-serif" 
        font-size="16" 
        font-weight="800" 
        letter-spacing="7" 
        fill="url(#luxuryGold)" 
        text-anchor="start"
        style="text-transform: uppercase;">UNISEX</text>
</svg>